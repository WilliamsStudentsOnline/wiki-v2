baseURL: https://wso-dev.williams.edu/wiki/
title: WSO Developer Wiki
locale: en-us
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: RSS
      weight: 4
      pageRef: /blog/index.xml
      params:
        icon: rss
    - name: Theme
      weight: 5
      params:
        type: theme-toggle
    - name: GitHub
      weight: 6
      url: https://github.com/WilliamsStudentsOnline
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: false
  theme:
    default: light
    displayToggle: false
